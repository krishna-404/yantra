name: CI

# Minimal Phase-0 CI (Y0.4). These two jobs are the required checks behind
# branch protection on main — the Grade gate's CI leg (loop-protocol.md §2.4).
# Playwright E2E, coverage gates, knip = Phase 1 (Y1.A).

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Vite validates import.meta.env at build time; the example values are valid.
      - run: cp apps/frontend/.env.example apps/frontend/.env
      - run: yarn build
      - run: yarn lint
      - run: yarn check-types

  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # knip loads apps/frontend/vite.config.ts, which resolves through
      # @connected-repo/zod-schemas' package exports to dist/ — build it first
      # (same reason as the tests job).
      - run: yarn workspace @connected-repo/zod-schemas run build
      - run: yarn knip

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Matches apps/backend/.env.test so `yarn db drop` always has a target.
          POSTGRES_DB: connected_repo_orpc_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Backend runs from TS via tsx, but @connected-repo/zod-schemas resolves
      # through its package exports to dist/ — build it in this job too.
      - run: yarn workspace @connected-repo/zod-schemas run build
      - run: yarn test:db:setup
      - run: yarn test:run
