name: CI

# Three jobs, deliberately. Previously five: a separate `tests` job ran the same
# vitest suite as `coverage` (test:run vs test:run --coverage) on its own runner
# with its own Postgres, and `knip` paid a full checkout+install to run a
# 1-minute check that needs no database. Setup (checkout → install → build)
# dominated the bill — roughly 7 of ~15 runner-minutes went on getting ready
# rather than testing.
#
# `coverage` is now the single unit-test gate: identical suite, plus the ratchet
# in apps/backend/coverage.thresholds.json.
#
# NOTE: branch protection's required checks must NOT list `tests` — that job no
# longer exists, and a required check that never reports blocks every PR
# forever. Required set is {checks, coverage}; `e2e` stays advisory (issue #7).

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build + lint + types + dead-code. No database needed, so knip rides along
  # here instead of paying for its own runner: `yarn build` already produces the
  # zod-schemas dist that knip needs to resolve vite.config.ts.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Vite validates import.meta.env at build time; the example values are valid.
      - run: cp apps/frontend/.env.example apps/frontend/.env
      - run: yarn build
      - run: yarn lint
      - run: yarn check-types
      - run: yarn knip

  # The unit-test gate. Runs the whole vitest suite AND enforces the coverage
  # ratchet, so it subsumes the old `tests` job entirely.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Matches apps/backend/.env.test so `yarn db drop` always has a target.
          POSTGRES_DB: connected_repo_orpc_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Backend runs from TS via tsx, but @connected-repo/zod-schemas resolves
      # through its package exports to dist/ — build it first.
      - run: yarn workspace @connected-repo/zod-schemas run build
      - run: yarn test:db:setup
      # Fails when coverage drops below the committed ratchet baseline in
      # apps/backend/coverage.thresholds.json (vitest coverage.thresholds).
      - run: yarn test:coverage

  # Playwright E2E (Y1.A / issue #5). NOT yet a required check — branch
  # protection stays {checks, coverage} until #7 promotes this.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Heavier than the unit jobs: builds backend + frontend (test mode) and
    # boots two servers before the suite runs, so give it more headroom.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Matches apps/backend/.env.test so `yarn db drop` always has a target.
          POSTGRES_DB: connected_repo_orpc_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Backend + the frontend test build resolve @connected-repo/zod-schemas
      # through its package exports to dist/ — build it first.
      - run: yarn workspace @connected-repo/zod-schemas run build
      # Frontend test-mode build + Playwright both read env from apps/frontend/.env.test
      # (Vite loadEnv and playwright.config.ts's dotenv). Turbo runs in strict env mode,
      # so job-level VITE_* vars would not reach those child processes — the file is the
      # reliable channel. Ports mirror apps/backend/.env.test (backend 3001, preview 5174).
      - name: Provision frontend test env
        run: |
          cat > apps/frontend/.env.test <<'EOF'
          VITE_USER_NODE_ENV=test
          VITE_OTEL_SERVICE_NAME=connected-repo-backend
          VITE_API_URL=http://localhost:3001
          VITE_USER_APP_URL=http://localhost:5174
          VITE_TEST_PASSWORD=SecureTestPassword123!@#
          EOF
      # Provision the test DB (drop → create → migrate → seed).
      - run: yarn test:db:setup
      # test:e2e boots the backend via `test:server:start` (node dist/server.js), so the
      # backend must be built in test mode first. Turbo's test:e2e task graph only builds
      # the frontend, not the backend, so build it explicitly here.
      - run: yarn workspace @connected-repo/backend run test:build
      # Chromium costs ~40 s to download on every run; cache it keyed on the
      # resolved Playwright version so only a version bump pays that. The system
      # deps from --with-deps are already present on ubuntu-latest images, so
      # restoring the browser bundle alone is sufficient.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/frontend
        run: yarn playwright install --with-deps chromium
      # Builds the frontend in test mode, then Playwright boots the backend test server
      # and the Vite preview and runs the suite headless (workers=1, retries=1 in CI).
      - run: yarn test:e2e:with-build
      # On failure, keep the HTML report + traces (trace: on-first-retry in CI) for triage.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/frontend/e2e/playwright-report/
            apps/frontend/e2e/test-results/
          retention-days: 7
